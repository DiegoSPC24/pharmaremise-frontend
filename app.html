<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaRemise — Application</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:   #1D9E75; --green-d: #0F6E56; --green-l: #E1F5EE;
      --blue:    #185FA5; --blue-l:  #E6F1FB;
      --purple:  #534AB7; --purple-l:#EEEDFE;
      --amber:   #BA7517; --amber-l: #FAEEDA;
      --red:     #E24B4A; --red-l:   #FCEBEB;
      --text:    #1A1A18; --sub:     #6B6B68;
      --bg:      #F5F5F0; --bg2:     #EBEBEB;
      --white:   #FFFFFF; --border:  #DDDDDA;
      --sidebar: #1A1A18;
    }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--sidebar); display:flex; flex-direction:column;
      padding: 0; overflow: hidden;
    }
    .sidebar-logo {
      padding: 20px 20px 16px;
      font-family:'DM Serif Display',serif; font-size:18px; color:var(--green);
      border-bottom: 0.5px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    .sidebar-logo span { color:rgba(255,255,255,0.7); }
    .sidebar-plan {
      padding: 10px 20px 14px;
      font-size: 11px; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 1px;
      border-bottom: 0.5px solid rgba(255,255,255,0.07);
    }
    .sidebar-plan strong { color: var(--green); font-weight:600; }
    nav.sidebar-nav { flex:1; padding: 12px 10px; overflow-y:auto; }
    .nav-item {
      display:flex; align-items:center; gap:10px;
      padding: 10px 12px; border-radius:8px;
      font-size:13px; font-weight:500; color:rgba(255,255,255,0.55);
      cursor:pointer; transition:all .15s; margin-bottom:2px;
      border: none; background:none; width:100%; text-align:left;
    }
    .nav-item:hover { background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.85); }
    .nav-item.active { background:var(--green); color:#fff; }
    .nav-item .icon { font-size:15px; flex-shrink:0; width:18px; }
    .nav-item .lock { margin-left:auto; font-size:10px; opacity:.4; }
    .sidebar-bottom {
      padding:12px 10px; border-top:0.5px solid rgba(255,255,255,0.07);
    }
    .sidebar-user {
      display:flex; align-items:center; gap:10px;
      padding: 8px 12px; border-radius:8px;
      cursor:pointer; transition:background .15s;
    }
    .sidebar-user:hover { background:rgba(255,255,255,0.06); }
    .user-avatar {
      width:30px; height:30px; border-radius:8px;
      background:var(--green); display:flex; align-items:center;
      justify-content:center; font-size:12px; font-weight:600; color:#fff;
      flex-shrink:0;
    }
    .user-info { flex:1; min-width:0; }
    .user-name { font-size:12px; color:rgba(255,255,255,0.8); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .user-plan { font-size:10px; color:rgba(255,255,255,0.35); }
    .btn-logout { font-size:11px; color:rgba(255,255,255,0.3); background:none; border:none; cursor:pointer; padding:2px 0; }
    .btn-logout:hover { color:var(--red); }

    /* ── MAIN ── */
    .main { flex:1; overflow:hidden; display:flex; flex-direction:column; }
    .topbar {
      height:52px; flex-shrink:0;
      background:var(--white); border-bottom:0.5px solid var(--border);
      display:flex; align-items:center; padding:0 24px; gap:16px;
    }
    .topbar-title { font-size:15px; font-weight:600; flex:1; }
    .topbar-mois {
      display:flex; align-items:center; gap:8px;
      background:var(--bg); border:0.5px solid var(--border);
      border-radius:8px; padding:6px 12px; font-size:13px;
    }
    .topbar-mois select { background:none; border:none; font-size:13px; font-family:'DM Sans',sans-serif; color:var(--text); cursor:pointer; }
    .content { flex:1; overflow-y:auto; padding:24px; }

    /* ── CARDS / KPI ── */
    .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
    .kpi-card {
      background:var(--white); border:0.5px solid var(--border);
      border-radius:12px; padding:16px 18px;
    }
    .kpi-lbl { font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .kpi-val { font-size:24px; font-weight:600; font-family:'DM Mono',monospace; }
    .kpi-val.green { color:var(--green); }
    .kpi-val.blue  { color:var(--blue); }
    .kpi-val.amber { color:var(--amber); }
    .kpi-sub { font-size:11px; color:var(--sub); margin-top:4px; }

    .card {
      background:var(--white); border:0.5px solid var(--border);
      border-radius:12px; padding:18px; margin-bottom:16px;
    }
    .card-title { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--sub); margin-bottom:14px; font-weight:600; }
    .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .card-header-title { font-size:13px; font-weight:600; }

    /* Tables */
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--sub); padding:7px 10px; text-align:left; border-bottom:0.5px solid var(--border); background:var(--bg); font-weight:600; }
    td { padding:8px 10px; border-bottom:0.5px solid var(--border); }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:var(--bg); }

    /* Badges statut */
    .badge { display:inline-block; font-size:10px; padding:2px 8px; border-radius:6px; font-weight:500; }
    .badge-green  { background:var(--green-l); color:var(--green-d); }
    .badge-blue   { background:var(--blue-l);  color:var(--blue); }
    .badge-amber  { background:var(--amber-l); color:var(--amber); }
    .badge-red    { background:var(--red-l);   color:var(--red); }
    .badge-purple { background:var(--purple-l);color:var(--purple); }
    .badge-gray   { background:var(--bg2);     color:var(--sub); }

    /* Boutons */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:500; cursor:pointer; border:none; font-family:'DM Sans',sans-serif; transition:all .15s; }
    .btn-green  { background:var(--green); color:#fff; }
    .btn-green:hover { background:var(--green-d); }
    .btn-outline { background:transparent; border:0.5px solid var(--border); color:var(--sub); }
    .btn-outline:hover { border-color:var(--green); color:var(--green); }
    .btn-blue { background:var(--blue); color:#fff; }
    .btn-sm { padding:5px 12px; font-size:12px; }

    /* Upload zone */
    .upload-zone {
      border:1.5px dashed var(--border); border-radius:12px;
      padding:40px; text-align:center; cursor:pointer;
      transition:border-color .2s, background .2s;
    }
    .upload-zone:hover { border-color:var(--green); background:var(--green-l); }
    .upload-icon { font-size:32px; margin-bottom:10px; }
    .upload-title { font-size:14px; font-weight:500; margin-bottom:4px; }
    .upload-sub { font-size:12px; color:var(--sub); }

    /* Progress / jauge */
    .jauge-wrap { background:var(--bg2); border-radius:100px; height:8px; overflow:hidden; }
    .jauge-fill { height:100%; border-radius:100px; transition:width .5s; }
    .jauge-green { background:var(--green); }
    .jauge-amber { background:var(--amber); }
    .jauge-red   { background:var(--red); }

    /* Alert */
    .alert { display:flex; align-items:flex-start; gap:12px; padding:12px 14px; border-radius:10px; font-size:13px; margin-bottom:10px; }
    .alert-green { background:var(--green-l); color:var(--green-d); border-left:3px solid var(--green); }
    .alert-amber { background:var(--amber-l); color:var(--amber); border-left:3px solid var(--amber); }
    .alert-red   { background:var(--red-l);   color:var(--red);   border-left:3px solid var(--red); }

    /* Loading */
    .spinner { display:inline-block; width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-center { display:flex; align-items:center; justify-content:center; padding:60px; gap:12px; color:var(--sub); font-size:14px; }

    /* Locked module */
    .locked-module {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:80px 40px; text-align:center;
    }
    .locked-icon { font-size:48px; margin-bottom:20px; }
    .locked-title { font-family:'DM Serif Display',serif; font-size:26px; margin-bottom:10px; }
    .locked-sub { font-size:15px; color:var(--sub); max-width:380px; margin-bottom:28px; }

    /* Sections */
    .section-bar {
      display:flex; align-items:center; gap:8px; padding:10px 14px;
      border-radius:8px; font-size:12px; font-weight:600;
      color:#fff; margin-bottom:14px;
    }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .three-col { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }

    /* Screen transitions */
    .screen { display:none; }
    .screen.active { display:block; animation:fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

    /* Toast */
    #toast {
      position:fixed; bottom:24px; right:24px; z-index:9999;
      background:var(--text); color:#fff; padding:12px 20px;
      border-radius:10px; font-size:13px; font-weight:500;
      transform:translateY(80px); opacity:0;
      transition:all .25s; pointer-events:none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    #toast.show { transform:translateY(0); opacity:1; }
    #toast.green { background:var(--green); }
    #toast.red   { background:var(--red); }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-logo">Pharma<span>Remise</span></div>
  <div class="sidebar-plan">Plan : <strong id="plan-label">Chargement...</strong></div>
  <nav class="sidebar-nav">
    <button class="nav-item active" onclick="goTo('accueil',this)">
      <span class="icon">🏠</span> Accueil
    </button>
    <button class="nav-item" id="nav-grossiste" onclick="goTo('grossiste',this)">
      <span class="icon">🏭</span> Grossiste
    </button>
    <button class="nav-item" id="nav-generiqueur" onclick="goTo('generiqueur',this)">
      <span class="icon">💊</span> Génériqueur
    </button>
    <button class="nav-item" id="nav-rfa" onclick="goTo('rfa',this)">
      <span class="icon">📋</span> RFA
    </button>
    <button class="nav-item" onclick="goTo('depot',this)">
      <span class="icon">📁</span> Dépôt factures
    </button>
    <button class="nav-item" onclick="goTo('comparateur',this)">
      <span class="icon">⚖️</span> Comparateur
    </button>
    <button class="nav-item" onclick="goTo('parametres',this)">
      <span class="icon">⚙️</span> Paramètres
    </button>
  </nav>
  <div class="sidebar-bottom">
    <div class="sidebar-user">
      <div class="user-avatar" id="user-avatar">P</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Chargement...</div>
        <div class="user-plan" id="user-plan">...</div>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()">← Déconnexion</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">Accueil</div>
    <div class="topbar-mois">
      <span>📅</span>
      <select id="sel-mois" onchange="onMoisChange()">
        <option value="1">Janvier 2026</option>
        <option value="2">Février 2026</option>
        <option value="3" selected>Mars 2026</option>
        <option value="4">Avril 2026</option>
      </select>
    </div>
    <button class="btn btn-outline btn-sm" onclick="refreshData()">↻ Actualiser</button>
  </div>

  <div class="content">

    <!-- ── ACCUEIL ── -->
    <div id="screen-accueil" class="screen active">
      <div id="accueil-content">
        <div class="loading-center"><div class="spinner"></div> Chargement...</div>
      </div>
    </div>

    <!-- ── GROSSISTE ── -->
    <div id="screen-grossiste" class="screen">
      <div id="grossiste-content">
        <div class="loading-center"><div class="spinner"></div> Chargement...</div>
      </div>
    </div>

    <!-- ── GENERIQUEUR ── -->
    <div id="screen-generiqueur" class="screen">
      <div id="generiqueur-content">
        <div class="loading-center"><div class="spinner"></div> Chargement...</div>
      </div>
    </div>

    <!-- ── RFA ── -->
    <div id="screen-rfa" class="screen">
      <div id="rfa-content">
        <div class="loading-center"><div class="spinner"></div> Chargement...</div>
      </div>
    </div>

    <!-- ── DÉPÔT ── -->
    <div id="screen-depot" class="screen">
      <div class="card">
        <div class="card-title">Déposer une facture</div>
        <div class="three-col" style="margin-bottom:16px">
          <button class="btn btn-outline" id="depot-tab-grossiste" onclick="setDepotTab('grossiste')" style="justify-content:center">🏭 Grossiste</button>
          <button class="btn btn-outline" id="depot-tab-labo" onclick="setDepotTab('labo')" style="justify-content:center">💊 Direct <div id="depot-form">
  <div class="upload-zone" 
       onclick="document.getElementById('file-input').click()"
       ondragover="event.preventDefault();this.style.borderColor='var(--primary)'"
       ondragleave="this.style.borderColor='var(--border)'"
       ondrop="onFileDrop(event)">
    <input type="file" id="file-input" accept=".pdf" multiple style="display:none" onchange="onFilesSelected(this.files)" />
    <div class="upload-icon">📄</div>
    <div class="upload-title">Glissez vos factures PDF ici</div>
    <div class="upload-sub">ou cliquez pour parcourir — plusieurs fichiers acceptés</div>
  </div>
  <div id="upload-queue" style="margin-top:12px"></div>
</div>

    <!-- ── COMPARATEUR ── -->
    <div id="screen-comparateur" class="screen">
      <div class="card">
        <div class="card-title">Comparateur d'offres</div>
        <div class="two-col">
          <div>
            <div style="font-size:13px;font-weight:600;margin-bottom:12px;color:var(--green)">Offre actuelle</div>
            <div class="form-field" style="margin-bottom:10px">
              <label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px">Taux remise pondérée (%)</label>
              <input type="number" id="cmp-pond-a" value="6.97" step="0.1" style="width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif"/>
            </div>
            <div class="form-field">
              <label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px">Taux contrat annuel (%)</label>
              <input type="number" id="cmp-ctr-a" value="9.0" step="0.1" style="width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif"/>
            </div>
          </div>
          <div>
            <div style="font-size:13px;font-weight:600;margin-bottom:12px;color:var(--amber)">Offre challenger</div>
            <div class="form-field" style="margin-bottom:10px">
              <label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px">Taux remise pondérée (%)</label>
              <input type="number" id="cmp-pond-b" placeholder="ex: 20" step="0.1" style="width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif"/>
            </div>
            <div class="form-field">
              <label style="font-size:12px;color:var(--sub);display:block;margin-bottom:4px">Taux contrat annuel (%)</label>
              <input type="number" id="cmp-ctr-b" placeholder="ex: 8" step="0.1" style="width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif"/>
            </div>
          </div>
        </div>
        <button class="btn btn-green" style="margin-top:16px" onclick="calculerComparateur()">Calculer →</button>
        <div id="cmp-result" style="margin-top:16px"></div>
      </div>
    </div>

    <!-- ── PARAMÈTRES ── -->
    <div id="screen-parametres" class="screen">
      <div id="parametres-content">
        <div class="loading-center"><div class="spinner"></div> Chargement...</div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /main -->

<div id="toast"></div>

<script>
const API = 'https://web-production-2202b.up.railway.app'
let TOKEN = localStorage.getItem('pharmaremise_token')
let MODULES = []
let CURRENT_SCREEN = 'accueil'
let CURRENT_MOIS = 3
let CURRENT_ANNEE = 2026
let PHARMACIE = null
let CONFIG_GROSSISTE = null
let GENERIQUEURS = []
let depot_tab = 'grossiste'
let selected_file = null

// ── Auth guard ──────────────────────────────────────────────────────────────
if (!TOKEN) window.location.href = '/index.html'

async function apiGet(path) {
  const r = await fetch(`${API}${path}`, { headers:{ Authorization:`Bearer ${TOKEN}` }})
  if (r.status === 401) { localStorage.clear(); window.location.href='/index.html'; }
  return r.json()
}
async function apiPost(path, body) {
  const r = await fetch(`${API}${path}`, {
    method:'POST', headers:{ Authorization:`Bearer ${TOKEN}`, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  })
  return r.json()
}
async function apiPut(path, body) {
  const r = await fetch(`${API}${path}`, {
    method:'PUT', headers:{ Authorization:`Bearer ${TOKEN}`, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  })
  return r.json()
}
async function apiPostForm(path, fd) {
  const r = await fetch(`${API}${path}`, {
    method:'POST', headers:{ Authorization:`Bearer ${TOKEN}` }, body: fd
  })
  return r.json()
}
async function apiPostPDF(path, body) {
  const r = await fetch(`${API}${path}`, {
    method:'POST', headers:{ Authorization:`Bearer ${TOKEN}`, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  })
  return r.blob()
}

function toast(msg, type='') {
  const t = document.getElementById('toast')
  t.textContent = msg; t.className = 'show ' + type
  setTimeout(() => t.className = '', 3000)
}

function eur(n) { return (parseFloat(n||0)).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €' }
function pct(n) { return (parseFloat(n||0)).toLocaleString('fr-FR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%' }

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    PHARMACIE = await apiGet('/auth/me')
    const abo = await apiGet('/abonnement/current')
    MODULES = abo.modules || []

    // Sidebar user
    document.getElementById('user-name').textContent = PHARMACIE.nom
    document.getElementById('user-plan').textContent = abo.plan
    document.getElementById('user-avatar').textContent = PHARMACIE.nom[0].toUpperCase()
    document.getElementById('plan-label').textContent = abo.plan.replace('_',' ')

    // Lock modules
    if (!MODULES.includes('grossiste')) {
      document.getElementById('nav-grossiste').innerHTML += '<span class="lock">🔒</span>'
    }
    if (!MODULES.includes('generiqueur')) {
      document.getElementById('nav-generiqueur').innerHTML += '<span class="lock">🔒</span>'
    }
    if (!MODULES.includes('rfa')) {
      document.getElementById('nav-rfa').innerHTML += '<span class="lock">🔒</span>'
    }

    // Charger config
    if (MODULES.includes('grossiste')) {
      CONFIG_GROSSISTE = await apiGet('/grossiste/config')
    }
    if (MODULES.includes('generiqueur')) {
      const r = await apiGet('/generiqueur/config')
      GENERIQUEURS = r
    }

    loadAccueil()
  } catch(e) {
    console.error(e)
    toast('Erreur de chargement', 'red')
  }
}

function logout() {
  localStorage.clear()
  window.location.href = '/index.html'
}

// ── Navigation ─────────────────────────────────────────────────────────────
function goTo(screen, btn) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
  document.getElementById('screen-'+screen).classList.add('active')
  CURRENT_SCREEN = screen

  const titles = { accueil:'Accueil', grossiste:'Contrôle Grossiste', generiqueur:'Contrôle Génériqueur',
                   rfa:'Contrôle RFA', depot:'Dépôt de factures', comparateur:'Comparateur', parametres:'Paramètres' }
  document.getElementById('topbar-title').textContent = titles[screen] || screen

  if (screen === 'grossiste')    loadGrossiste()
  if (screen === 'generiqueur')  loadGeneriqueur()
  if (screen === 'rfa')          loadRFA()
  if (screen === 'parametres')   loadParametres()
}

function onMoisChange() {
  const v = document.getElementById('sel-mois').value.split('-')
  CURRENT_MOIS = parseInt(document.getElementById('sel-mois').value)
  if (CURRENT_SCREEN !== 'accueil') goTo(CURRENT_SCREEN, document.querySelector('.nav-item.active'))
  else loadAccueil()
}

function refreshData() {
  goTo(CURRENT_SCREEN, document.querySelector('.nav-item.active'))
  toast('Données actualisées', 'green')
}

// ── ACCUEIL ───────────────────────────────────────────────────────────────
async function loadAccueil() {
  const el = document.getElementById('accueil-content')
  el.innerHTML = '<div class="loading-center"><div class="spinner"></div> Chargement...</div>'

  try {
    let synthGr = null, synthGe = null
    if (MODULES.includes('grossiste')) {
      synthGr = await apiGet(`/grossiste/synthese?mois=${CURRENT_MOIS}&annee=${CURRENT_ANNEE}`)
    }
    if (MODULES.includes('generiqueur')) {
      synthGe = await apiGet(`/generiqueur/synthese?mois=${CURRENT_MOIS}&annee=${CURRENT_ANNEE}`)
    }

    const ca_gr = synthGr ? synthGr.ca_total : 0
    const rem_gr = synthGr ? synthGr.remise_totale : 0
    const ca_ge = synthGe ? synthGe.totaux.ca_total : 0
    const rem_ge = synthGe ? synthGe.totaux.contrat_total : 0

    el.innerHTML = `
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-lbl">CA Grossiste</div>
          <div class="kpi-val">${eur(ca_gr)}</div>
          <div class="kpi-sub">Ce mois</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-lbl">Remise Grossiste</div>
          <div class="kpi-val green">${eur(rem_gr)}</div>
          <div class="kpi-sub">Estimée</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-lbl">CA Génériqueurs</div>
          <div class="kpi-val">${eur(ca_ge)}</div>
          <div class="kpi-sub">Ce mois</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-lbl">Contrats attendus</div>
          <div class="kpi-val blue">${eur(rem_ge)}</div>
          <div class="kpi-sub">Génériqueurs</div>
        </div>
      </div>

      ${synthGr ? renderGrossisteStats(synthGr) : ''}

      <div class="card">
        <div class="card-title">Accès rapides</div>
        <div class="three-col">
          ${MODULES.includes('grossiste') ? `<button class="btn btn-outline" onclick="goTo('depot',document.getElementById('nav-grossiste'))" style="justify-content:center">📄 Déposer une facture</button>` : ''}
          ${MODULES.includes('generiqueur') ? `<button class="btn btn-outline" onclick="goTo('generiqueur',document.getElementById('nav-generiqueur'))" style="justify-content:center">💊 Voir génériqueurs</button>` : ''}
          ${MODULES.includes('rfa') ? `<button class="btn btn-outline" onclick="goTo('rfa',document.getElementById('nav-rfa'))" style="justify-content:center">📋 Contrôle RFA</button>` : ''}
        </div>
      </div>
    `
  } catch(e) {
    el.innerHTML = '<div class="loading-center">Erreur de chargement</div>'
  }
}

function renderGrossisteStats(s) {
  if (!s || !s.stats_statut) return ''
  const statuts = s.stats_statut
  const total = s.ca_total || 1
  const rows = Object.entries(statuts).map(([k,v]) =>
    `<tr><td>${k}</td><td>${eur(v.ca)}</td><td>${((v.ca/total)*100).toFixed(1)}%</td><td>${v.nb}</td></tr>`
  ).join('')
  return `
    <div class="card">
      <div class="card-title">Répartition grossiste — ce mois</div>
      <table>
        <thead><tr><th>Statut</th><th>CA HT</th><th>%</th><th>Lignes</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `
}

function badgeClass(statut) {
  const map = { eligible:'badge-green', produit_cher:'badge-amber', remise_facture:'badge-blue',
                generique:'badge-gray', biosimilaire:'badge-purple', tva_20:'badge-red', frigo:'badge-blue' }
  return map[statut] || 'badge-gray'
}

async function exportPDFGrossiste() {

  return `<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer">

}

async function saveConfig() {
  const body = {
    taux_remise_pct:     parseFloat(document.getElementById('p-taux').value),
    seuil_cher:          parseFloat(document.getElementById('p-seuil').value),
    forfait_cher:        parseFloat(document.getElementById('p-forfait').value),
    exclure_tva20:       document.getElementById('p-tva20').checked,
    exclure_biosim:      document.getElementById('p-biosim').checked,
    exclure_frigo:       document.getElementById('p-frigo').checked,
    exclure_stupefiants: document.getElementById('p-stup').checked,
    exclure_tva55: false, exclure_tva10: false, seuil_biosim: 465,
  }
  CONFIG_GROSSISTE = await apiPut('/grossiste/config', body)
  toast('Configuration sauvegardée !', 'green')
}

// ── DÉPÔT ─────────────────────────────────────────────────────────────────
function setDepotTab(tab) {
  depot_tab = tab
  ;['grossiste','labo','rfa'].forEach(t => {
    document.getElementById('depot-tab-'+t).className = 'btn ' + (t===tab ? 'btn-green' : 'btn-outline')
  })
function onFileDrop(event) {
  event.preventDefault();
  event.currentTarget.style.borderColor = 'var(--border)';
  onFilesSelected(event.dataTransfer.files);
}

function onFilesSelected(files) {
  if (!files || files.length === 0) return;
  Array.from(files).forEach(f => {
    if (f.type === 'application/pdf') {
      uploadFactureAuto(f);
    }
  });
}

async function uploadFactureAuto(file) {
  const queue = document.getElementById('upload-queue');
  const id = 'file-' + Date.now() + Math.random();
  const div = document.createElement('div');
  div.id = id;
  div.className = 'alert alert-green';
  div.style = 'margin-bottom:8px;display:flex;align-items:center;gap:8px';
  div.innerHTML = `<span>⏳</span><span>${file.name}</span><span style="margin-left:auto;font-size:12px">Analyse en cours...</span>`;
  queue.appendChild(div);

  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch(`${API}/grossiste/factures/analyser`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: fd
    });
    const data = await res.json();
    if (res.ok) {
      div.innerHTML = `<span>✅</span><span>${file.name}</span><span style="margin-left:auto;font-size:12px;color:var(--primary)">${data.total_ht}€ HT — ${data.remise_calculee}€ remise</span>`;
    } else {
      div.innerHTML = `<span>❌</span><span>${file.name}</span><span style="margin-left:auto;font-size:12px;color:red">${data.detail || 'Erreur'}</span>`;
    }
  } catch(e) {
    div.innerHTML = `<span>❌</span><span>${file.name}</span><span style="margin-left:auto;font-size:12px;color:red">Erreur réseau</span>`;
  }
}

async function uploadFacture() {
  if (!selected_file) return
  const fd = new FormData()
  fd.append('file', selected_file)

  toast('Analyse en cours...')
  try {
    let result
    if (depot_tab === 'grossiste') {
      const params = new URLSearchParams({ mois:CURRENT_MOIS, annee:CURRENT_ANNEE })
      result = await apiPostForm(`/grossiste/factures/analyser?${params}`, fd)
    } else {
      toast('Dépôt direct labo — disponible prochainement', 'red')
      return
    }

    const el = document.getElementById('depot-result')
    el.style.display = 'block'
    el.innerHTML = `
      <div class="alert alert-green">
        <span>✓</span>
        <div>
          <strong>Analyse réussie !</strong> ${result.nb_lignes} lignes analysées —
          CA éligible : ${eur(result.ca_eligible)} —
          Remise estimée : <strong>${eur(result.remise_calculee)}</strong>
        </div>
      </div>
    `
    toast('Facture analysée !', 'green')
  } catch(e) {
    toast('Erreur d\'analyse', 'red')
  }
}

// ── COMPARATEUR ───────────────────────────────────────────────────────────
async function calculerComparateur() {
  const pond_a = parseFloat(document.getElementById('cmp-pond-a').value)||0
  const ctr_a  = parseFloat(document.getElementById('cmp-ctr-a').value)||0
  const pond_b = parseFloat(document.getElementById('cmp-pond-b').value)||0
  const ctr_b  = parseFloat(document.getElementById('cmp-ctr-b').value)||0

  if (!pond_b && !ctr_b) { toast('Remplissez les taux de l\'offre challenger', 'red'); return }

  let ca = 0
  if (MODULES.includes('generiqueur')) {
    const synth = await apiGet(`/generiqueur/synthese?mois=${CURRENT_MOIS}&annee=${CURRENT_ANNEE}`)
    ca = synth.totaux.ca_total || 0
  }
  if (!ca) ca = 10000 // valeur exemple si pas de données

  const rem_a = ca * pond_a/100 + ca * ctr_a/100
  const rem_b = ca * pond_b/100 + ca * ctr_b/100
  const diff  = rem_b - rem_a
  const winner = diff > 0 ? 'B' : 'A'

  document.getElementById('cmp-result').innerHTML = `
    <div class="alert ${winner==='A'?'alert-amber':'alert-green'}">
      <span>${winner==='A'?'✓':'→'}</span>
      <div>
        <strong>${winner==='A' ? 'Maintenir l\'offre actuelle' : 'L\'offre challenger est meilleure'}</strong><br/>
        Différence : <strong>${eur(Math.abs(diff))}</strong> sur un CA de ${eur(ca)}
        (Offre A : ${eur(rem_a)} — Offre B : ${eur(rem_b)})
      </div>
    </div>
  `
}
